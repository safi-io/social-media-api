services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./:/code/
    env_file:
      - .env

    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: web_project
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
